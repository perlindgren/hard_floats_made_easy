[package]
name = "hfe"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = [
    "critical-section-single-core",
    "inline-asm",
] }

cortex-m-rt = { version = "0.7.5" }

critical-section = { version = "1.2.0" }
panic-halt = "1.0.0"

[lib]
test = false
doctest = false
bench = false

[features]

[profile.release]
panic = "abort"
opt-level = 3
# lto = true
# codegen-units = 1
